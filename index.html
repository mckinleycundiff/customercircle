<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#f7f7f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CustomerCircle">
<title>CustomerCircle</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23ffffff'/%3E%3Ccircle cx='50' cy='50' r='38' fill='none' stroke='%2338539A' stroke-width='6'/%3E%3Ccircle cx='42' cy='50' r='14' fill='%2338539A' opacity='0.55'/%3E%3Ccircle cx='58' cy='50' r='14' fill='%2338539A' opacity='0.75'/%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root { --bg:#f7f7f8; --card:#fff; --border:#e5e5ea; --text:#2c2c2c; --dim:#8e8e93; --accent:#38539A; --shadow:0 1px 3px rgba(0,0,0,.06); }
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); height:100dvh; display:flex; flex-direction:column; overflow:hidden; }
header { background:rgba(247,247,248,.92); backdrop-filter:blur(12px); border-bottom:1px solid var(--border); padding:12px 16px 10px; display:flex; flex-direction:column; gap:10px; flex-shrink:0; }
.nav-btns { display:flex; background:#e4e4e9; border-radius:14px; padding:4px; overflow-x:auto; -webkit-overflow-scrolling:touch; }
.nav-btn { background:transparent; border:none; color:#666; border-radius:11px; padding:9px 6px; margin-top:0; line-height:1.15; font-size:.72rem; font-weight:600; cursor:pointer; flex:1 1 0; min-width:0; text-align:center; }
.tab-radio { position:absolute; top:0; left:0; opacity:0; width:1px; height:1px; pointer-events:none; }
#chat-view, #customers-view, #reminders-view, #attention-view, #more-view { display:none !important; }
#tab-chat:checked ~ #chat-view { display:flex !important; flex-direction:column; flex:1; min-height:0; }
#tab-customers:checked ~ #customers-view,
#tab-reminders:checked ~ #reminders-view,
#tab-attention:checked ~ #attention-view,
#tab-more:checked ~ #more-view { display:block !important; }
#tab-chat:checked ~ header label[for="tab-chat"],
#tab-customers:checked ~ header label[for="tab-customers"],
#tab-reminders:checked ~ header label[for="tab-reminders"],
#tab-attention:checked ~ header label[for="tab-attention"],
#tab-more:checked ~ header label[for="tab-more"] { background:#fff; color:#38539A; box-shadow:0 1px 4px rgba(0,0,0,.12); font-weight:600; }
.nav-btn.active { background:#fff; color:var(--accent); box-shadow:0 1px 4px rgba(0,0,0,.12); font-weight:600; }
.chat-container { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; min-height:0; }
#app-version { text-align:center; font-size:.68rem; color:#8e8e93; opacity:.55; padding:0 12px 4px; flex-shrink:0; }
.product-tile { display:flex; gap:8px; align-items:center; margin:12px 16px 0; padding:10px 8px 10px 12px; background:#fff; border:1px solid var(--border); border-radius:16px; box-shadow:var(--shadow); flex-shrink:0; color:inherit; }
.potd-main { display:flex; gap:12px; align-items:center; flex:1; min-width:0; background:none; border:none; padding:0; text-align:left; color:inherit; font:inherit; cursor:pointer; }
.potd-caret { width:32px; height:32px; border:none; background:none; color:#38539A; font-size:1.05rem; cursor:pointer; flex-shrink:0; }
.product-tile.collapsed .potd-img, .product-tile.collapsed .potd-name, .product-tile.collapsed .potd-line { display:none; }
.product-tile img { width:64px; height:64px; object-fit:contain; border-radius:12px; background:#f3f4f8; flex-shrink:0; }
.potd-kicker { font-size:.68rem; letter-spacing:.06em; text-transform:uppercase; color:#38539A; font-weight:700; }
.potd-name { font-weight:650; font-size:.95rem; margin-top:2px; }
.potd-line { color:var(--dim); font-size:.8rem; margin-top:2px; }
.potd-hero { display:block; background:#f7f7f8; border-radius:16px; padding:12px; }
.potd-hero img { width:100%; max-height:280px; object-fit:contain; }
.message { max-width:82%; padding:12px 16px; border-radius:18px; font-size:.96rem; line-height:1.45; box-shadow:var(--shadow); word-wrap:break-word; }
.message.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:6px; }
.message.bot { align-self:flex-start; background:#fff; border:1px solid var(--border); border-bottom-left-radius:6px; }
.message.bot strong { color:var(--accent); }
.message.bot a.who { color:var(--accent); font-weight:650; text-decoration:none; cursor:pointer; }
.message.bot a.who:hover { text-decoration:underline; }
.quick-actions { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px; flex-shrink:0; }
.chip { background:#fff; border:1px solid var(--border); border-radius:20px; padding:8px 14px; font-size:.82rem; color:var(--accent); cursor:pointer; box-shadow:var(--shadow); }
.input-area { display:flex; gap:10px; padding:12px 16px 24px; border-top:1px solid var(--border); flex-shrink:0; background:rgba(247,247,248,.96); }
.input-area input { flex:1; border:1px solid var(--border); border-radius:22px; padding:13px 18px; font-size:1rem; outline:none; }
.input-area button, .btn { background:var(--accent); color:#fff; border:none; cursor:pointer; }
.input-area button { border-radius:50%; width:46px; height:46px; font-size:1.2rem; }
.btn { border-radius:12px; padding:14px; width:100%; font-size:1rem; font-weight:550; margin-top:10px; }
.btn.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
.list-view { flex:1; overflow-y:auto; padding:16px; }
.customer-card, .attention-card { background:#fff; border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:10px; cursor:pointer; box-shadow:var(--shadow); }
.badge { display:inline-block; font-size:.7rem; padding:3px 9px; border-radius:12px; margin-left:6px; background:#38539A15; color:var(--accent); }
.empty { text-align:center; color:var(--dim); padding:60px 20px; }
.modal { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:flex-end; z-index:100; }
.modal.show { display:flex; }
.modal-content { background:#fff; border-radius:24px 24px 0 0; width:100%; max-height:88vh; overflow-y:auto; padding:22px; }
.modal-close { float:right; background:none; border:none; color:var(--dim); font-size:1.5rem; cursor:pointer; }
.history-table { width:100%; border-collapse:collapse; font-size:.86rem; margin-top:10px; }
.history-head, .history-row { display:grid; grid-template-columns:78px 78px 1fr; gap:6px; width:100%; text-align:left; }
.history-head { color:var(--dim); font-size:.75rem; font-weight:500; padding:8px 4px; }
.history-row { background:#fff; border:none; border-bottom:1px solid var(--border); padding:14px 4px; font-size:.9rem; color:inherit; font-family:inherit; cursor:pointer; }
.history-table th, .history-table td { text-align:left; padding:10px 6px; border-bottom:1px solid var(--border); }
.history-table th { color:var(--dim); font-weight:500; font-size:.75rem; }
.login-screen { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100dvh; gap:16px; padding:24px; text-align:center; }
.field { width:100%; border:1px solid var(--border); border-radius:12px; padding:12px 14px; font-size:1rem; margin-top:8px; }
label { display:block; font-size:.8rem; color:var(--dim); margin-top:12px; }
.guide-highlight { outline:3px solid #38539A; outline-offset:4px; border-radius:12px; }
.heard-label { font-size:.72rem; letter-spacing:.04em; text-transform:uppercase; color:#38539A; font-weight:700; margin-bottom:6px; }
.heard-actions { display:flex; gap:8px; margin-top:10px; }
.heard-actions .btn { width:auto; margin:0; padding:8px 16px; font-size:.9rem; }
.plan-row { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; padding:8px 0; border-bottom:1px solid var(--border); }
.plan-x { border:none; background:none; color:#8e8e93; font-size:1.15rem; line-height:1; cursor:pointer; width:28px; flex-shrink:0; }
.thinking { display:flex; gap:5px; align-items:center; min-width:54px; }
.thinking span { width:7px; height:7px; border-radius:50%; background:#8e8e93; animation:dot 1s infinite ease-in-out; }
.thinking span:nth-child(2) { animation-delay:.15s; }
.thinking span:nth-child(3) { animation-delay:.3s; }
@keyframes dot { 0%,80%,100% { opacity:.25; transform:translateY(0); } 40% { opacity:1; transform:translateY(-3px); } }



#app { display:none; flex-direction:column; flex:1; min-height:0; }
body.in #app { display:flex; }
#customer-pane { display:none; }
.pane-empty { color:var(--dim); text-align:center; padding:48px 16px; }
@media (min-width: 900px) {
  body.in #app { display:grid; grid-template-columns:220px minmax(0,1fr) 360px; grid-template-rows:minmax(0,1fr); height:100dvh; }
  #app > header { grid-column:1; border-bottom:none; border-right:1px solid var(--border); height:100%; overflow:auto; }
  #app > header .topbar { flex-direction:column; align-items:flex-start; gap:10px; }
  .nav-btns { flex-direction:column; background:transparent; padding:8px 0 0; overflow:visible; }
  .nav-btn { flex:none; text-align:left; padding:10px 12px; }
  #tab-chat:checked ~ #chat-view,
  #tab-customers:checked ~ #customers-view,
  #tab-reminders:checked ~ #reminders-view,
  #tab-attention:checked ~ #attention-view,
  #tab-more:checked ~ #more-view { grid-column:2; grid-row:1; min-height:0; overflow:auto; }
  #chat-view { align-items:center; }
  #chat-view > * { width:100%; max-width:760px; }
  #customer-pane { display:block; grid-column:3; grid-row:1; min-height:0; overflow:auto; background:#fff; border-left:1px solid var(--border); }
  #customer-pane-body { padding:8px 18px 28px; }
  .input-area { padding-bottom:16px; }
  #app > header { position:relative; }
  #help-btn { position:absolute; left:16px; bottom:18px; }
  #amway-link { position:absolute; left:50%; bottom:16px; transform:translateX(-50%); }
}
</style>
</head>

<div id="login-screen" class="login-screen">
  <svg width="48" height="48" viewBox="0 0 100 100"><circle cx="50" cy="50" r="38" fill="none" stroke="#38539A" stroke-width="6"/><circle cx="42" cy="50" r="14" fill="#38539A" opacity="0.55"/><circle cx="58" cy="50" r="14" fill="#38539A" opacity="0.75"/></svg>
  <h2>CustomerCircle</h2>
  <p style="color:var(--dim);max-width:280px;">Sign in with Google to open your customer circle.</p>

  <p id="login-error" style="color:#b42318;font-size:.85rem;"></p>

const SUPABASE_URL = 'https://igfzsivcupfcigzrmltw.supabase.co';

function previewClient() {
  const bags = () => ({ customers, activities, reminders });
  return {
    auth: { getSession: async () => ({ data: { session: null } }), signInWithOAuth: async () => ({ error: null }), signOut: async () => ({}) },
    rpc: async () => ({ data: 'preview-user', error: null }),
    from(name) {
      const state = { op: 'select', row: null, patch: null, filters: [] };
      const api = {
        select() { return api; },
        insert(row) { state.op = 'insert'; state.row = row; return api; },
        update(row) { state.op = 'update'; state.patch = row; return api; },
        eq(key, value) { state.filters.push([key, value]); return api; },
        order() { return api; },
        limit() { return api; },
        maybeSingle() { return Promise.resolve({ data: { amway_id: myIbo }, error: null }); },
        single() { return api._run(true); },
        then(resolve, reject) { return api._run(false).then(resolve, reject); },
        _run(single) {
          const bag = bags()[name];
          if (state.op === 'insert') {
            const row = { id: 'p' + Date.now(), ...state.row };
            if (name === 'customers') customers.push(row);
            if (name === 'activities') activities.unshift(row);
            if (name === 'reminders') reminders.push(row);
            if (name === 'profiles') myIbo = row.amway_id || myIbo;
            return Promise.resolve({ data: single ? row : [row], error: null });
          }
          if (state.op === 'update' && bag) {
            bag.forEach(item => {
              if (state.filters.every(([k, v]) => item[k] === v)) Object.assign(item, state.patch);
            });
            if (name === 'profiles') myIbo = state.patch.amway_id ?? myIbo;
            return Promise.resolve({ data: null, error: null });
          }
          const rows = (bag || []).filter(item => state.filters.every(([k, v]) => item[k] === v));
          return Promise.resolve({ data: single ? (rows[0] || null) : rows, error: null });
        }
      };
      return api;
    }
  };
}
const PREVIEW = new URLSearchParams(location.search).has('preview') || location.hostname.endsWith('ship.place');
let sb;
try {
  sb = PREVIEW ? previewClient() : window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = null;

function bindChrome() {

}

function today() { return new Date().toISOString().slice(0, 10); }
function formatDate(d) {
  if (!d) return '—';
  return new Date(d + 'T00:00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}
function daysBetween(a, b) { return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function daysUntilWeekday(target) {
  const diff = target - new Date().getDay();
  return diff <= 0 ? diff + 7 : diff;
}
function addDays(n) {
  const d = new Date(); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10);
}
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c])); }
function displayName() {
  const m = currentUser?.user_metadata || {};
  return (m.full_name || m.name || '').trim();
}

async function loadData() {
  const uid = currentUser.id;
  const [c, a, r] = await Promise.all([
    sb.from('customers').select('*').order('name'),
    sb.from('activities').select('*').order('date', { ascending: false }),
    sb.from('reminders').select('*').eq('completed', false).order('reminder_date')
  ]);
  if (c.error) { await addMessage('Could not load customers. Run the SQL setup in Supabase first. ' + c.error.message); }
  customers = c.data || [];
  activities = a.data || [];
  reminders = r.data || [];
  const profile = await sb.from('profiles').select('amway_id').eq('id', uid).maybeSingle();
  myIbo = profile.data?.amway_id || '';
}

function customerById(id) { return customers.find(c => c.id === id); }
function whoLink(id, label) {
  return '<a class="who" href="#" onclick="event.preventDefault();openCard(\'' + id + '\')">' + esc(label) + '</a>';
}
function findInText(text) {
  if (!text) return null;
  const lower = text.toLowerCase();
  const exact = [...customers].sort((a, b) => b.name.length - a.name.length).find(c => lower.includes(c.name.toLowerCase()));
  if (exact) return exact;
  const words = lower.match(/[a-z][a-z'-]*/g) || [];
  const scored = customers.map(c => {
    const parts = c.name.toLowerCase().split(/\s+/).filter(Boolean);
    let score = 0;
    parts.forEach(part => {
      if (words.includes(part)) score += 2;
      else if (part.length >= 4 && words.some(w => w.length >= 3 && (part.startsWith(w) || w.startsWith(part)))) score += 1;
    });
    return { c, score, need: parts.length };
  }).filter(s => s.score >= 2 && s.score >= s.need);
  scored.sort((a, b) => b.score - a.score);
  if (!scored.length) return null;
  if (scored.length === 1 || scored[0].score > scored[1].score) return scored[0].c;
  return null;
}
function findByName(name) {
  const n = name.toLowerCase().trim();
  return customers.find(c => c.name.toLowerCase() === n) || customers.find(c => c.name.toLowerCase().includes(n)) || null;
}

function showThinking() {

async function sendMessage() {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  await addMessage(esc(text), 'user', true);
  showThinking();
  try {
    if (pending && pending.kind === 'confirm') {
      const yes = /^(yes|y|confirm|ok|okay|go)$/i.test(text);
      const no = /^(no|n|cancel|stop)$/i.test(text);
      if (yes || no) { await confirmHeard(yes, false); return; }
      pending = null;
      await addMessage('Cancelled that. Reading this as a new request.');
    }
    if (pending && text.toLowerCase() !== 'cancel') { await pending.handle(text); return; }
    if (text.toLowerCase() === 'cancel') { pending = null; await addMessage('Cancelled. Nothing was saved.'); return; }
    const spoken = normalizeUtterance(text);
    const clauses = splitClauses(spoken);
    const plans = planSequence(clauses);
    if (plans && plans.length > 1) { await askPlan(plans); return; }
    const cmd = clauses.length === 1 ? registry.find(c => c.match(spoken)) : null;
    if (cmd) { await cmd.run(spoken); return; }
    const words = spoken.trim().split(/\s+/).length;
    if (words >= 8) {
      const grok = await interpretWithGrok(text);
      if (!grok.error) {
        const fromGrok = plansFromActions(grok.actions || []);
        if (fromGrok && fromGrok.length) { await askPlan(fromGrok); return; }
      }
    }
    const person = findByName(spoken);
    if (person) openCard(person.id);
    else await addMessage("Try Add customer, Called, Set reminder, or Who needs attention. A sentence can include more than one. Type help for the list.");
  } catch (err) {
    await addMessage('Something went wrong: ' + esc(err.message));
  } finally {
    hideThinking();
  }
}

async function confirmHeard(ok, fromButton) {
  if (!pending || pending.kind !== 'confirm') return;
  const job = pending;
  pending = null;
  document.querySelectorAll('.heard-yes, .heard-no').forEach(b => { b.disabled = true; b.style.opacity = '.45'; });
  if (fromButton) await addMessage(ok ? 'Confirm' : 'Cancel', 'user');
  if (!ok) { await addMessage('Cancelled. Nothing was saved.'); return; }
  showThinking();
  try { await job.run(); }
  catch (err) { await addMessage('Something went wrong: ' + esc(err.message)); }
  finally { hideThinking(); }
}


function normalizeUtterance(text) {
  let spoken = text.trim().replace(/^(i|we|just)\s+/i, '');
  spoken = spoken.replace(/,\s*and\s+(i|we)\s+/gi, '. ');
  spoken = spoken.replace(/,\s*(?=(i\s+)?(called|texted|emailed|met with|bought|purchased|sampled|followed up|remind|set reminder)\b)/gi, '. ');
  spoken = spoken.replace(/\s+\band\s+(i|we)\s+/gi, '. ');
  spoken = spoken.replace(/\s+\band\s+(?=(called|texted|emailed|met with|bought|purchased|sampled|followed up|remind|set reminder)\b)/gi, '. ');
  return spoken.replace(/\s+/g, ' ').trim();
}
function planSequence(clauses) {
  const plans = [];
  let last = null;
  for (const clause of clauses) {
    const plan = planClause(clause, last);
    if (!plan) return null;
    plans.push(plan);
    if (plan.customer) last = plan.customer;
  }
  return plans;
}
function splitClauses(text) {
  const lead = /^(add\b|called\b|texted\b|emailed\b|met with\b|purchased\b|bought\b|sampled\b|followed up\b|follow-up\b|log\b|remind\b|set reminder\b|check in\b|open contact\b|find\b|search\b|show\b|share with\b|suggest\b|who needs\b)/i;
  const raw = text.split(/\s*(?:\.|;|\n+|\bthen\b)\s*/i).map(s => s.trim()).filter(Boolean);
  const joined = [];
  raw.forEach(part => {
    if (joined.length && !lead.test(part)) joined[joined.length - 1] += '. ' + part;
    else joined.push(part);
  });
  const out = [];
  joined.forEach(part => {
    const bits = part.split(/\s+\band\b\s+/i);
    let current = bits[0];
    for (let i = 1; i < bits.length; i++) {
      if (lead.test(bits[i])) { out.push(current.trim()); current = bits[i]; }
      else current += ' and ' + bits[i];
    }
    if (current.trim()) out.push(current.trim());
  });
  return out;
}
function planAdd(text) {
  if (!/^(add\s+customer|add)\b/i.test(text)) return null;
  let cleaned = text.replace(/^(add\s+customer|add)\s+/i, '').trim();
  if (!cleaned) return null;
  let preferred = 'Text';
  const pref = cleaned.match(/primary\s+contact\s+(call|text|email|app)|preferred\s+(call|text|email|app)/i);
  if (pref) { preferred = (pref[1] || pref[2]); preferred = preferred[0].toUpperCase() + preferred.slice(1).toLowerCase(); cleaned = cleaned.replace(pref[0], ''); }
  let howMet = '';
  const met = cleaned.match(/met\s+(?:at|through|via|from)\s+(.+?)(?:\.|$)/i);
  if (met) { howMet = met[1].trim(); cleaned = cleaned.replace(met[0], ''); }
  const name = cleaned.split(/[.\n]/)[0].replace(/\s+/g, ' ').trim();
  if (!name) return null;
  const row = { user_id: currentUser.id, name, preferred, how_met: howMet, sponsor_id: null, phone: '', email: '', notes: '' };
  return {
    summary: 'Add <strong>' + esc(name) + '</strong>' + (howMet ? ' · met ' + esc(howMet) : ''),
    run: async () => {
      const { data, error } = await sb.from('customers').insert(row).select().single();
      if (error) { await addMessage('Could not add customer: ' + error.message); return; }
      customers.push(data);
      await addMessage('Added ' + whoLink(data.id, data.name) + (howMet ? ' (met at ' + esc(howMet) + ')' : '') + '.', 'bot', true);
      renderCustomers();
    }
  };
}
function planLog(customer, type, notes) {
  return {
    summary: 'Log ' + esc(type) + ' for <strong>' + esc(customer.name) + '</strong>' + (notes ? ' · ' + esc(notes) : ''),
    run: async () => {
      const row = { user_id: currentUser.id, customer_id: customer.id, date: today(), type, notes: notes || '' };
      const { data, error } = await sb.from('activities').insert(row).select().single();
      if (error) { await addMessage('Could not log activity: ' + error.message); return; }
      activities.unshift(data);
      await sb.from('customers').update({ last_contact: today() }).eq('id', customer.id);
      customer.last_contact = today();
      await addMessage('Logged ' + whoLink(customer.id, type) + ' for ' + whoLink(customer.id, customer.name) + (notes ? ': ' + esc(notes) : '') + '.', 'bot', true);
    }
  };
}
function planReminder(customer, when, action) {
  return {
    summary: 'Remind <strong>' + esc(customer.name) + '</strong> on ' + esc(formatDate(when)) + (action ? ' · ' + esc(action) : ''),
    run: async () => {

      renderReminders();

}
function planClause(text, inherited) {
  const add = planAdd(text);
  if (add) return add;
  if (/^(log\b|activity\b|called\b|texted\b|emailed\b|met with\b|purchased\b|bought\b|sampled\b|followed up\b|follow-up\b)/i.test(text)) {
    const parsed = extractActivity(text);
    if (!parsed.type) return null;
    const customer = findInText(parsed.rest);
    if (!customer) return null;
    const plan = planLog(customer, parsed.type, cleanNotes(parsed.rest, customer.name));
    plan.customer = customer;
    return plan;
  }
  if (/\b(remind|reminder|check in)\b/i.test(text)) {
    const cleaned = text.replace(/^(set\s+)?(reminder|remind me|check in)\s*(to|with|about|for)?\s*/i, '').trim();
    const customer = findInText(cleaned) || inherited || null;
    if (!customer) return null;
    const action = cleaned.replace(new RegExp(customer.name, 'i'), '').replace(/\b(on|in|tomorrow|today|me|monday|tuesday|wednesday|thursday|friday|saturday|sunday|next week)\b/ig, '').replace(/\s+/g, ' ').trim();
    const plan = planReminder(customer, parseWhen(cleaned), action);
    plan.customer = customer;
    return plan;
  }
  if (/^open\s+contact\b/i.test(text)) {
    const match = findByName(text.replace(/^open\s+contact\s*/i, '')) || findInText(text);
    if (!match) return null;
    return { summary: 'Open <strong>' + esc(match.name) + '</strong>', run: async () => { showView('customers'); openCard(match.id); await addMessage('Opened ' + whoLink(match.id, match.name) + '.', 'bot', true); } };
  }
  return null;
}
function normType(value) {
  const key = String(value || '').toLowerCase().replace(/\s+/g, '');
  return { call:'Call', text:'Text', email:'Email', meeting:'Meeting', purchase:'Purchase', sample:'Sample', 'follow-up':'Follow-up', followup:'Follow-up', note:'Note' }[key] || 'Note';
}
function plansFromActions(actions) {
  if (!Array.isArray(actions) || !actions.length) return null;
  const plans = [];
  for (const a of actions) {
    if (a.kind === 'add-customer' && a.name) { const plan = planAdd('Add customer ' + a.name + (a.how_met ? '. Met at ' + a.how_met : '')); if (!plan) return null; plans.push(plan); continue; }
    const customer = findByName(a.name || '') || findInText(a.name || '');
    if (!customer) return null;
    if (a.kind === 'log-activity') plans.push(planLog(customer, normType(a.type), a.notes || ''));
    else if (a.kind === 'reminder') plans.push(planReminder(customer, parseWhen(a.when || ''), a.action || ''));
    else if (a.kind === 'open-contact') plans.push({ summary: 'Open <strong>' + esc(customer.name) + '</strong>', run: async () => { showView('customers'); openCard(customer.id); } });
    else return null;
  }
  return plans;
}
let planItems = [];

  planItems = items.map((item, i) => ({ ...item, i, on: true }));

    ).join('') +

    'bot', true);
  pending = { kind: 'confirm', run: async () => {
    const chosen = planItems.filter(item => item.on);
    if (!chosen.length) { await addMessage('Nothing left to save.'); return; }
    for (const item of chosen) await item.run();
  }};
}
function dropPlan(i) {
  const item = planItems.find(x => x.i === i);
  if (item) item.on = false;

  if (row) row.remove();
}
async function interpretWithGrok(text) {
  const { data, error } = await sb.functions.invoke('smooth-function', {
    body: { text: text.slice(0, 1000), customers: customers.map(c => c.name) }
  });
  if (error) {
    let message = 'Grok could not read that. Try one command at a time.';
    try {
      const body = await error.context.json();
      if (body && body.message) message = body.message;
    } catch (e) {}
    return { error: message };
  }
  return data || {};
}

function extractActivity(text) {
  let cleaned = text.replace(/^(log\s+(an?\s+)?(activity\s+)?|activity\s+)/i, '').trim();
  const verbs = [
    [/^(followed\s+up|follow[\s-]?up)\b/i, 'Follow-up'],
    [/^texted\b/i, 'Text'], [/^called\b/i, 'Call'], [/^emailed\b/i, 'Email'],
    [/^met\s+with\b/i, 'Meeting'], [/^purchased\b/i, 'Purchase'], [/^bought\b/i, 'Purchase'],
    [/^sampled\b/i, 'Sample'], [/^meeting\b/i, 'Meeting'], [/^purchase\b/i, 'Purchase'],
    [/^sample\b/i, 'Sample'], [/^email\b/i, 'Email'], [/^call\b/i, 'Call'], [/^text\b/i, 'Text']
  ];
  let type = null;
  for (const [re, label] of verbs) {
    if (re.test(cleaned)) { type = label; cleaned = cleaned.replace(re, '').trim(); break; }
  }
  cleaned = cleaned.replace(/^(with|for|to|about)\s+/i, '').replace(/^[-–—:,]+\s*/, '').trim();
  return { type, rest: cleaned };
}
function cleanNotes(text, name) {
  const parts = String(name || '').toLowerCase().split(/\s+/).filter(Boolean);
  const kept = String(text || '').split(/\s+/).filter(word => {
    const w = word.toLowerCase().replace(/[^a-z'-]/g, '');
    if (!w || /^(with|for|to|about|and)$/i.test(w)) return false;
    return !parts.some(part => w === part || (w.length >= 3 && part.length >= 4 && w.length <= part.length && part.slice(0, 3) === w.slice(0, 3)));
  });
  const notes = kept.join(' ').replace(/[.,;:]+$/g, '').trim();
  if (/^(ed|ing|s|a|the)$/i.test(notes) || notes.length < 2) return '';
  return notes;
}
async function finishActivity(customer, type, notes) {
  await askConfirm(
    'Log ' + whoLink(customer.id, type) + ' for ' + whoLink(customer.id, customer.name) + '<br>Note: ' + esc(notes || '—'),
    async () => {
      const row = { user_id: currentUser.id, customer_id: customer.id, date: today(), type, notes: notes || '' };
      const { data, error } = await sb.from('activities').insert(row).select().single();
      if (error) { await addMessage('Could not log activity: ' + error.message); return; }
      activities.unshift(data);
      await sb.from('customers').update({ last_contact: today() }).eq('id', customer.id);
      customer.last_contact = today();
      await addMessage('Logged ' + whoLink(customer.id, type) + ' for ' + whoLink(customer.id, customer.name) + (notes ? ': ' + esc(notes) : '') + '.', 'bot', true);
    }
  );
}

register({
  id: 'log-activity',
  match: t => /^(log\b|activity\b|called\b|texted\b|emailed\b|met with\b|purchased\b|bought\b|sampled\b|followed up\b|follow-up\b)/i.test(t),
  run: async (text) => {
    const parsed = extractActivity(text);
    if (!parsed.type && !parsed.rest) {
      showActivityMenu();

    const customer = findInText(parsed.rest);
    if (!customer) {
      await addMessage(parsed.type ? `Who did you log this ${parsed.type} for?` : 'Which customer?');

        const notes = cleanNotes(n, person.name);
        if (notes) { await finishActivity(person, parsed.type || 'Note', notes); return; }
        await addMessage(`Add a note for this ${parsed.type || 'activity'} with ${person.name}? Type it, or skip.`);
        pending = { handle: async note => finishActivity(person, parsed.type || 'Note', /^(skip|none|no|n\/a|-)$/i.test(note.trim()) ? '' : note.trim()) };
      }};
      return;
    }
    const notes = cleanNotes(parsed.rest, customer.name);
    if (!notes) {
      await addMessage(`Add a note for this ${parsed.type || 'activity'} with ${customer.name}? Type it, or skip.`);
      pending = { handle: async note => finishActivity(customer, parsed.type || 'Note', /^(skip|none|no|n\/a|-)$/i.test(note.trim()) ? '' : note.trim()) };
      return;
    }
    await finishActivity(customer, parsed.type || 'Note', notes);
  }
});

function parseWhen(text) {
  const lower = text.toLowerCase();
  if (lower.includes('tomorrow')) return addDays(1);
  if (lower.includes('today')) return today();
  const inDays = lower.match(/in\s+(\d+)\s+days?/);
  if (inDays) return addDays(parseInt(inDays[1], 10));
  const days = { sunday:0, monday:1, tuesday:2, wednesday:3, thursday:4, friday:5, saturday:6 };
  for (const [name, n] of Object.entries(days)) if (lower.includes(name)) return addDays(daysUntilWeekday(n));
  return addDays(7);
}

async function refreshLastContact(customerId) {

function pickFile(type) {

async function handleImport(event) {

  if (!file) return;

  closeModal();
  if ((event.target.dataset.kind || '') === 'vcf' || file.name.endsWith('.vcf')) await importVcf(text);
  else await importCsv(text);
  event.target.value = '';
}
async function importCsv(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  if (lines.length < 2) { await addMessage('Import file is empty.'); return; }
  const headers = lines[0].split(',').map(h => h.replace(/^"|"$/g, '').trim().toLowerCase());
  const idx = name => headers.findIndex(h => h.includes(name));
  let added = 0;
  for (let i = 1; i < lines.length; i++) {
    const cells = (lines[i].match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || []).map(c => c.replace(/^"|"$/g, '').trim());
    const name = cells[idx('name')] || cells[0];
    if (!name || findByName(name)) continue;
    const { data, error } = await sb.from('customers').insert({
      user_id: currentUser.id, name,
      phone: cells[idx('phone')] || '',
      email: cells[idx('email')] || '',
      how_met: cells[idx('met')] || '',
      preferred: cells[idx('prefer')] || 'Text'
    }).select().single();
    if (!error && data) { customers.push(data); added++; }
  }
  await addMessage(`Imported ${added} customer${added === 1 ? '' : 's'}.`);
  if (currentView === 'customers') renderCustomers();
}
async function importVcf(text) {
  let added = 0;
  text.split('BEGIN:VCARD').forEach(async () => {});
  for (const card of text.split('BEGIN:VCARD')) {
    if (!card.includes('END:VCARD')) continue;
    const fn = card.match(/FN[;:]([^\r\n]+)/i);
    if (!fn) continue;
    let name = fn[1].trim();
    if (findByName(name)) continue;
    const phone = (card.match(/TEL[^:]*:([^\r\n]+)/i) || [])[1] || '';
    const email = (card.match(/EMAIL[^:]*:([^\r\n]+)/i) || [])[1] || '';
    const { data, error } = await sb.from('customers').insert({
      user_id: currentUser.id, name, phone: phone.trim(), email: email.trim(), preferred: phone ? 'Call' : 'Text'
    }).select().single();
    if (!error && data) { customers.push(data); added++; }
  }
  await addMessage(`Imported ${added} contact${added === 1 ? '' : 's'} from vCard.`);
  if (currentView === 'customers') renderCustomers();
}
function exportData() {
  const rows = [['Name','Phone','Email','How Met','Preferred','Amway ID','Last Contact','Activity Date','Activity Type','Activity Notes']];
  customers.forEach(c => {
    const acts = activities.filter(a => a.customer_id === c.id);
    if (!acts.length) rows.push([c.name, c.phone||'', c.email||'', c.how_met||'', c.preferred||'', c.amway_id||'', c.last_contact||'', '', '', '']);
    else acts.forEach(a => rows.push([c.name, c.phone||'', c.email||'', c.how_met||'', c.preferred||'', c.amway_id||'', c.last_contact||'', a.date||'', a.type||'', a.notes||'']));
  });
  const csv = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
  a.download = 'CustomerCircle-export.csv';
  a.click();
}

function startGuide() {
  const steps = [
    { title: 'Chat', body: 'Most actions happen here. Type “Add customer Jane Doe” or “Called Mike about samples.”', view: 'chat', highlight: '#chat' },
    { title: 'Quick actions', body: 'These fill the box so you can finish the sentence. Log activity opens a menu first.', view: 'chat', highlight: '#quick-actions' },
    { title: 'Customers', body: 'Everyone you track. Tap a name for history, call, and text. Import and export live here.', view: 'customers', highlight: '[data-view="customers"]' },
    { title: 'Reminders', body: '“Set reminder to call Jane on Tuesday.” Open ones stay on this tab until you mark them done.', view: 'reminders', highlight: '[data-view="reminders"]' },
    { title: 'Attention', body: 'People you have not contacted recently, plus anyone with a due reminder.', view: 'attention', highlight: '[data-view="attention"]' },
    { title: 'More', body: 'Save your IBO number, share your circle by email or IBO number, or send feedback with a screenshot.', view: 'more', highlight: '[data-view="more"]' }
  ];
  let i = 0;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:flex-end;';
  const paint = () => {
    document.querySelectorAll('.guide-highlight').forEach(el => el.classList.remove('guide-highlight'));
    const s = steps[i];
    showView(s.view);
    const target = document.querySelector(s.highlight);
    if (target) target.classList.add('guide-highlight');
    overlay.innerHTML = `<div style="background:#fff;border-radius:24px 24px 0 0;padding:22px;width:100%;">
      <div style="color:#8e8e93;font-size:.75rem;">${i + 1} of ${steps.length}</div>
      <h2 style="color:#38539A;margin:8px 0;">${s.title}</h2>
      <p style="line-height:1.45;margin-bottom:16px;">${s.body}</p>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        ${i ? '<button class="btn ghost" style="width:auto;padding:10px 16px;" id="g-back">Back</button>' : ''}
        <button class="btn" style="width:auto;padding:10px 16px;" id="g-next">${i === steps.length - 1 ? 'Done' : 'Next'}</button>
      </div></div>`;
    overlay.querySelector('#g-next').onclick = () => { if (i === steps.length - 1) { overlay.remove(); document.querySelectorAll('.guide-highlight').forEach(el => el.classList.remove('guide-highlight')); showView('chat'); } else { i++; paint(); } };
    const back = overlay.querySelector('#g-back');
    if (back) back.onclick = () => { i--; paint(); };
  };
  paint();
  document.body.appendChild(overlay);
}

renderProductTile();
boot();
</script>
